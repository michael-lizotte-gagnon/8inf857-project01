services:
  syslog-ng:
    image: docker.io/balabit/syslog-ng:latest
    # command: ["-V"]
    # --no-caps fixes an ops not permitted from the kernel https://serverfault.com/questions/524518/error-setting-capabilities-capability-management-disabled
    command: ["-F", "--no-caps", "-f", "/etc/syslog-ng/syslog-ng.conf"]
    volumes:
      - snort-logs:/var/log/snort:ro # <- yoink read-only log files from snort
      - ./syslog-ng/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
      - ./logs:/var/log # Bind output to /var/log, mount on local ./logs path for now
    restart: unless-stopped
    profiles: ["enabled"]
  snort:
    image: snort3:local
    build:
      context: .
      dockerfile: snort.Dockerfile
    # Pulled from image docs https://github.com/DevotionZhu/dockerfiles-vimagick/blob/master/snort/README.md
    command: -q -c /usr/local/etc/snort/snort.lua -y -i eth0 -A alert_json -l /var/log/snort
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - snort-logs:/var/log/snort # output of alerts
      - ./snort-conf/snort.lua:/usr/local/etc/snort/snort.lua:ro
      - ./snort-conf/rules:/usr/local/etc/snort/rules:ro
    depends_on: 
      - syslog-ng
    restart: unless-stopped
    profiles: ["enabled"]
  elastic-search:
    image: docker.io/elasticsearch:9.5.5
    environment:
      xpack.security.enabled: "false"
      discovery.type: "single-node"
    ports:
      - "9200:9200"
      - "9300:9300"
    restart: unless-stopped
    profiles: ["enabled"]
  kibana:
    image: docker.io/kibana:9.5.5
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: '["http://elastic-search:9200"]'
      xpack.security.enabled: "false"
    depends_on:
      - elastic-search
    restart: unless-stopped
    profiles: ["enabled"]
  logstash:
    image: docker.io/logstash:9.5.5
    cap_add:
      - DAC_READ_SEARCH
    volumes:
      - snort-logs:/var/log/snort:ro
      - logstash-data:/usr/share/logstash/data
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      - elastic-search
    restart: unless-stopped
    profiles: ["enabled"]
  snort-test-web:
    image: docker.io/library/nginx:alpine
    volumes:
      - ./snort-test-web:/usr/share/nginx/html:ro
    depends_on:
      - logstash
    profiles: ["test-alerts"]
  snort-test-capture:
    image: snort3:local
    network_mode: host
    command: -q -c /usr/local/etc/snort/snort.lua -y -i podman1 -k none -A alert_json -l /var/log/snort
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - snort-logs:/var/log/snort
      - ./snort-conf/snort.lua:/usr/local/etc/snort/snort.lua:ro
      - ./snort-conf/rules:/usr/local/etc/snort/rules:ro
    depends_on:
      - snort
      - snort-test-web
    profiles: ["test-alerts"]
  snort-test-client:
    image: docker.io/curlimages/curl:8.12.1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for sequence in 1 2; do
          curl --fail --silent --show-error "http://snort-test-web/snort-test?run=$$sequence"
        done
    depends_on:
      - snort
      - snort-test-web
      - snort-test-capture
    profiles: ["test-alerts"]
volumes:
  snort-logs:
  logstash-data: