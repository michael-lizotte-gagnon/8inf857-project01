services:
  syslog-ng:
    image: docker.io/balabit/syslog-ng:latest
    # command: ["-V"]
    # --no-caps fixes an ops not permitted from the kernel https://serverfault.com/questions/524518/error-setting-capabilities-capability-management-disabled
    command: ["-F", "--no-caps", "-f", "/etc/syslog-ng/syslog-ng.conf"]
    volumes:
      - snort-logs:/var/log/snort:ro # <- yoink read-only log files from snort
      - ./syslog-ng/syslog-ng.conf:/etc/syslog-ng/syslog-ng.conf:ro
      - ./logs:/var/log # Bind output to /var/log, mount on local ./logs path for now
    restart: unless-stopped
    profiles: ["enabled"]
  snort:
    image: snort3:local
    build:
      context: .
      dockerfile: snort.Dockerfile
    # Pulled from image docs https://github.com/DevotionZhu/dockerfiles-vimagick/blob/master/snort/README.md
    command: -q -c /usr/local/etc/snort/snort.lua -y -i podman1 -k none --daq afpacket -A alert_json -l /var/log/snort
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - snort-logs:/var/log/snort # output of alerts
      - ./snort-conf/snort.lua:/usr/local/etc/snort/snort.lua:ro
      - ./snort-conf/rules:/usr/local/etc/snort/rules:ro
    depends_on: 
      - syslog-ng
    restart: unless-stopped
    profiles: ["enabled"]
  elastic-search:
    image: docker.io/elasticsearch:9.5.5
    environment:
      xpack.security.enabled: "false"
      discovery.type: "single-node"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    restart: unless-stopped
    profiles: ["enabled"]
  kibana:
    image: docker.io/kibana:9.5.5
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: '["http://elastic-search:9200"]'
      xpack.security.enabled: "false"
    depends_on:
      - elastic-search
    restart: unless-stopped
    profiles: ["enabled"]
  kibana-import:
    image: docker.io/curlimages/curl:8.12.1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        attempt=0
        until curl --fail --silent http://kibana:5601/api/status \
          | grep -Eq '"overall"[[:space:]]*:[[:space:]]*\{[[:space:]]*"level"[[:space:]]*:[[:space:]]*"available"'; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 60 ]; then
            echo "Kibana did not become ready within 120 seconds." >&2
            exit 1
          fi
          sleep 2
        done
        curl --fail --silent --show-error \
          -X POST "http://kibana:5601/api/saved_objects/_import?overwrite=true" \
          -H "kbn-xsrf: true" \
          -F "file=@/usr/share/kibana-import/snort-alerts-dashboard.ndjson"
    volumes:
      - ./kibana/snort-alerts-dashboard.ndjson:/usr/share/kibana-import/snort-alerts-dashboard.ndjson:ro
    depends_on:
      - kibana
    profiles: ["enabled"]
  logstash:
    image: docker.io/logstash:9.5.5
    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
    cap_add:
      - DAC_READ_SEARCH
    volumes:
      - snort-logs:/var/log/snort:ro
      - logstash-data:/usr/share/logstash/data
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      - elastic-search
    restart: unless-stopped
    profiles: ["enabled"]
  snort-target:
    image: snort-target:local
    build:
      context: .
      dockerfile: snort-target.Dockerfile
    environment:
      MYSQL_ROOT_PASSWORD: snort-test-root
      MYSQL_DATABASE: snort_test
      MYSQL_USER: snort_test
      MYSQL_PASSWORD: snort-test-password
    healthcheck:
      test: ["CMD-SHELL", "mariadb --protocol=TCP -h 127.0.0.1 -u\"$${MYSQL_USER}\" -p\"$${MYSQL_PASSWORD}\" -e 'SELECT 1' --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      - snort
    restart: unless-stopped
    profiles: ["enabled"]
  snort-icmp-test-client:
    image: docker.io/library/python:3.13-alpine
    entrypoint: ["python", "/scripts/trigger-snort-dos.py"]
    cap_add:
      - NET_RAW
    volumes:
      - ./scripts/trigger-snort-dos.py:/scripts/trigger-snort-dos.py:ro
    depends_on:
      snort:
        condition: service_started
      snort-target:
        condition: service_healthy
    profiles: ["test-snort-dos"]
  snort-ssh-burst-test-client:
    image: docker.io/library/python:3.13-alpine
    entrypoint: ["python", "/scripts/trigger-snort-ssh-burst.py"]
    volumes:
      - ./scripts/trigger-snort-ssh-burst.py:/scripts/trigger-snort-ssh-burst.py:ro
    depends_on:
      snort:
        condition: service_started
      snort-target:
        condition: service_healthy
    profiles: ["test-snort-ssh-burst"]
  snort-port-scan-test-client:
    image: snort-nmap:local
    build:
      context: .
      dockerfile: snort-nmap.Dockerfile
    cap_add:
      - NET_RAW
    command: ["-sS", "-n", "-Pn", "-T3", "-p", "1-1024", "snort-target"]
    depends_on:
      snort:
        condition: service_started
      snort-target:
        condition: service_healthy
    profiles: ["test-snort-port-scan"]
  snort-sql-obfuscation-web:
    image: snort-sql-obfuscation-web:local
    build:
      context: .
      dockerfile: snort-sql-web.Dockerfile
    environment:
      MYSQL_HOST: snort-target
      MYSQL_USER: snort_test
      MYSQL_PASSWORD: snort-test-password
    depends_on:
      snort-target:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get('http://127.0.0.1/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s
    profiles: ["test-snort-sql-obfuscation"]
  snort-sql-obfuscation-test-client:
    image: docker.io/curlimages/curl:8.12.1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        curl --fail --silent --show-error \
          "http://snort-sql-obfuscation-web/execute?query=SET%20SESSION%20sql_mode=%27PIPES_AS_CONCAT%27%3B%20SET%20@query=CHAR(83)%7C%7CCHAR(72)%7C%7CCHAR(79)%7C%7CCHAR(87)%7C%7CCHAR(32)%7C%7CCHAR(68)%7C%7CCHAR(65)%7C%7CCHAR(84)%7C%7CCHAR(65)%7C%7CCHAR(66)%7C%7CCHAR(65)%7C%7CCHAR(83)%7C%7CCHAR(69)%7C%7CCHAR(83)%3B%20PREPARE%20stmt%20FROM%20@query%3B%20EXECUTE%20stmt%3B%20DEALLOCATE%20PREPARE%20stmt"
    depends_on:
      snort:
        condition: service_started
      snort-sql-obfuscation-web:
        condition: service_healthy
    profiles: ["test-snort-sql-obfuscation"]
  snort-smb-traversal-test-server:
    image: docker.io/library/python:3.13-alpine
    entrypoint: ["python", "/scripts/snort-smb-dummy-server.py"]
    volumes:
      - ./scripts/snort-smb-dummy-server.py:/scripts/snort-smb-dummy-server.py:ro
    profiles: ["test-snort-smb"]
  snort-smb-traversal-test-client:
    image: docker.io/library/python:3.13-alpine
    entrypoint: ["python", "/scripts/trigger-snort-smb-traversal.py"]
    volumes:
      - ./scripts/trigger-snort-smb-traversal.py:/scripts/trigger-snort-smb-traversal.py:ro
    depends_on:
      snort:
        condition: service_started
      snort-smb-traversal-test-server:
        condition: service_started
    profiles: ["test-snort-smb"]

volumes:
  elasticsearch-data:
  snort-logs:
  logstash-data: