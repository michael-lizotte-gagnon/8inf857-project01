input {
  file {
    path => "/var/log/snort/alert_json.txt"
    start_position => "beginning"
    # Versioned path replays alerts already in the shared volume after the ingestion change.
    sincedb_path => "/usr/share/logstash/data/snort-alerts-volume-v2.sincedb"
    codec => json
  }
}

filter {
  date {
    match => [ "timestamp", "yy/MM/dd-HH:mm:ss.SSSSSS" ]
    timezone => "UTC"
  }
}

output {
  elasticsearch {
    hosts => ["http://elastic-search:9200"]
    index => "snort-alerts-%{+YYYY.MM.dd}"
  }
}
